---
esphome:
  name: office-macropad
  friendly_name: office-macropad

rp2040:
  board: rpipicow
  framework:
    # Required until https://github.com/platformio/platform-raspberrypi/pull/36
    # is merged
    platform_version: https://github.com/maxgerhardt/platform-raspberrypi.git

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "***"

ota:
  password: "***"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "Office-Macropad Fallback Hotspot"
    password: "6PEXOvXEvw65"


binary_sensor:

  - platform: gpio
    pin:
      number: 16
      mode: INPUT_PULLUP
      inverted: true
    name: "button1"
    filters:
      - delayed_on: 10ms

  - platform: gpio
    pin:
      number: 17
      mode: INPUT_PULLUP
      inverted: true
    name: "button2"
    filters:
      - delayed_on: 10ms


  - platform: gpio
    pin:
      number: 18
      mode: INPUT_PULLUP
      inverted: true
    name: "button3"
    filters:
      - delayed_on: 10ms

  - platform: gpio
    pin:
      number: 19
      mode: INPUT_PULLUP
      inverted: true
    name: "button4"
    filters:
      - delayed_on: 10ms

  - platform: gpio
    pin:
      number: 20
      mode: INPUT_PULLUP
      inverted: true
    name: "button5"
    filters:
      - delayed_on: 10ms

  - platform: gpio
    pin:
      number: 21
      mode: INPUT_PULLUP
      inverted: true
    name: "button6"
    filters:
      - delayed_on: 10ms

  - platform: gpio
    pin:
      number: 22
      mode: INPUT_PULLUP
      inverted: true
    name: "button7"
    filters:
      - delayed_on: 10ms

  - platform: gpio
    pin:
      number: 26
      mode: INPUT_PULLUP
      inverted: true
    name: "button8"
    filters:
      - delayed_on: 10ms
